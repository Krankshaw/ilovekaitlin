<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Protocol</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --red:#ff2244; --pink:#ff6b9d; --deep:#cc1133; --glow:#ff4466; --soft:#ffb3c8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; color:var(--red); font-family:'Share Tech Mono',monospace; height:100vh; width:100vw; overflow:hidden; }
  .scanlines {
    position:fixed; inset:0; pointer-events:none; z-index:200;
    background:repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(255,34,68,0.03) 3px, rgba(255,34,68,0.03) 4px);
  }
  .vignette {
    position:fixed; inset:0; pointer-events:none; z-index:199;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.88) 100%);
  }

  /* ── BOOT ── */
  #boot {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:#000; z-index:10; transition:opacity 0.9s ease;
  }
  .title-wrap { text-align:center; margin-bottom:48px; }
  .glitch-title {
    font-family:'Cinzel Decorative',serif;
    font-size:clamp(1.4rem,3.5vw,2.6rem); color:var(--pink);
    text-shadow:0 0 20px var(--glow),0 0 60px var(--deep);
    letter-spacing:0.12em; animation:flicker 5s infinite;
  }
  @keyframes flicker { 0%,94%,100%{opacity:1} 95%{opacity:.5} 96%{opacity:1} 97%{opacity:.2} 98%{opacity:1} }
  .subtitle { font-size:0.65rem; color:#cc4466; letter-spacing:0.45em; margin-top:6px; text-transform:uppercase; }
  .terminal {
    width:min(540px,90vw); border:1px solid #440011; border-radius:4px;
    background:rgba(255,34,68,0.04); padding:22px 26px;
    box-shadow:0 0 40px rgba(255,34,68,0.12),inset 0 0 20px rgba(255,34,68,0.03);
    margin-bottom:38px; min-height:200px;
  }
  .term-line { font-size:0.73rem; line-height:1.9; color:var(--red); opacity:0; transform:translateX(-8px); transition:opacity 0.35s ease,transform 0.35s ease; }
  .term-line.visible { opacity:1; transform:translateX(0); }
  .term-line.pink { color:var(--pink); }
  .term-line.soft { color:var(--soft); text-shadow:0 0 10px var(--pink); }
  .term-line.dim  { color:#aa3355; }
  .cursor-blink::after { content:'█'; animation:blink 1s step-end infinite; }
  @keyframes blink { 50%{opacity:0} }
  .btn-init {
    font-family:'Share Tech Mono',monospace; font-size:0.82rem; letter-spacing:0.22em; text-transform:uppercase;
    color:#000; background:linear-gradient(135deg,var(--red),var(--pink));
    border:none; padding:14px 44px; border-radius:3px; cursor:pointer;
    opacity:0; transform:translateY(12px);
    transition:opacity 0.7s ease,transform 0.7s ease,box-shadow 0.25s;
    box-shadow:0 0 30px rgba(255,34,68,0.45); position:relative; overflow:hidden;
  }
  .btn-init.show { opacity:1; transform:translateY(0); }
  .btn-init:hover { box-shadow:0 0 70px rgba(255,100,150,0.85),0 0 120px rgba(255,34,68,0.35); }
  .btn-init::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0.18),transparent); opacity:0; transition:opacity 0.25s; }
  .btn-init:hover::before { opacity:1; }

  /* ── RAINING HEARTS ── */
  #rain-container { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:4; }
  .heart-drop {
    position:absolute; top:-60px; font-size:1.2rem; opacity:0;
    animation:fall linear infinite; color:var(--deep);
    text-shadow:0 0 6px var(--deep); user-select:none;
  }
  @keyframes fall {
    0%   { transform:translateY(0) rotate(0deg);   opacity:0;   }
    5%   { opacity:0.35; }
    90%  { opacity:0.18; }
    100% { transform:translateY(110vh) rotate(25deg); opacity:0; }
  }

  /* ── MINIGAME SCREEN ── */
  #game-screen {
    position:fixed; inset:0; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; z-index:8; transition:opacity 0.6s ease;
    padding:20px;
  }
  #game-screen.active { opacity:1; pointer-events:all; }

  .game-header {
    text-align:center; margin-bottom:24px;
  }
  .game-level-tag {
    font-size:0.6rem; letter-spacing:0.4em; color:var(--deep); text-transform:uppercase; margin-bottom:8px;
  }
  .game-title {
    font-family:'Cinzel Decorative',serif; font-size:clamp(1rem,2.5vw,1.5rem);
    color:var(--pink); text-shadow:0 0 20px var(--glow); letter-spacing:0.1em;
  }
  .game-subtitle {
    font-size:0.65rem; color:#cc4466; margin-top:6px; letter-spacing:0.2em;
  }

  /* Progress pips */
  .progress-pips {
    display:flex; gap:10px; margin-bottom:28px; justify-content:center;
  }
  .pip {
    width:28px; height:6px; border-radius:3px;
    background:#1a0008; border:1px solid #440011; transition:background 0.4s, box-shadow 0.4s;
  }
  .pip.done { background:var(--deep); box-shadow:0 0 8px var(--red); }
  .pip.active { background:var(--pink); box-shadow:0 0 14px var(--pink); }

  /* Game card */
  .game-card {
    width:min(520px,92vw); border:1px solid #440022; border-radius:6px;
    background:rgba(255,34,68,0.04); padding:28px 30px;
    box-shadow:0 0 50px rgba(255,34,68,0.1),inset 0 0 30px rgba(255,34,68,0.03);
    min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; position:relative;
  }

  /* Generic input */
  .g-input {
    font-family:'Share Tech Mono',monospace; font-size:1.1rem; letter-spacing:0.2em;
    background:transparent; border:none; border-bottom:2px solid var(--deep);
    color:var(--pink); text-align:center; outline:none; width:100%; padding:6px 0;
    text-transform:uppercase; transition:border-color 0.3s;
    caret-color: var(--pink);
  }
  .g-input:focus { border-bottom-color:var(--pink); }
  .g-input::placeholder { color:#aa3355; }

  .g-btn {
    font-family:'Share Tech Mono',monospace; font-size:0.75rem; letter-spacing:0.25em;
    text-transform:uppercase; color:#000;
    background:linear-gradient(135deg,var(--red),var(--pink));
    border:none; padding:11px 32px; border-radius:3px; cursor:pointer;
    transition:box-shadow 0.25s; box-shadow:0 0 20px rgba(255,34,68,0.4);
  }
  .g-btn:hover { box-shadow:0 0 50px rgba(255,100,150,0.8); }
  .g-btn:disabled { opacity:0.4; cursor:not-allowed; }

  .g-hint { font-size:0.65rem; color:#cc4466; letter-spacing:0.15em; text-align:center; }
  .g-feedback {
    font-size:0.8rem; letter-spacing:0.15em; text-align:center;
    min-height:1.4em; transition:color 0.3s;
  }
  .g-feedback.ok  { color:#00ff88; text-shadow:0 0 10px #00ff88; }
  .g-feedback.err { color:var(--red); animation:shake 0.3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  .g-clue {
    font-size:clamp(0.8rem,2vw,1rem); color:var(--soft);
    text-shadow:0 0 12px var(--pink); letter-spacing:0.18em;
    text-align:center; line-height:1.7;
  }

  /* ── LEVEL 1: Cipher ── */
  .cipher-display {
    font-size:clamp(0.85rem,4vw,1.4rem); letter-spacing:clamp(0.1em,1.5vw,0.35em);
    color:var(--red); text-shadow:0 0 8px var(--deep); text-align:center;
    line-height:2; word-break:break-all; white-space:normal; width:100%;
  }

  /* ── LEVEL 2: Simon Hearts ── */
  .simon-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(280px,75vw);
  }
  .simon-btn {
    aspect-ratio:1; border-radius:8px; border:2px solid transparent;
    cursor:pointer; font-size:1.8rem; display:flex; align-items:center; justify-content:center;
    transition:transform 0.1s, box-shadow 0.2s, filter 0.2s;
    user-select:none; filter:brightness(0.4);
  }
  .simon-btn.lit { filter:brightness(1.3); transform:scale(1.07); }
  .simon-btn[data-c="0"] { background:#330011; border-color:#cc1133; box-shadow:0 0 20px rgba(204,17,51,0.3); }
  .simon-btn[data-c="1"] { background:#001133; border-color:#1166cc; box-shadow:0 0 20px rgba(17,102,204,0.3); }
  .simon-btn[data-c="2"] { background:#003311; border-color:#11cc44; box-shadow:0 0 20px rgba(17,204,68,0.3); }
  .simon-btn[data-c="3"] { background:#332200; border-color:#cc8811; box-shadow:0 0 20px rgba(204,136,17,0.3); }
  .simon-btn[data-c="0"].lit { box-shadow:0 0 50px rgba(255,34,68,0.9); }
  .simon-btn[data-c="1"].lit { box-shadow:0 0 50px rgba(17,150,255,0.9); }
  .simon-btn[data-c="2"].lit { box-shadow:0 0 50px rgba(17,255,80,0.9); }
  .simon-btn[data-c="3"].lit { box-shadow:0 0 50px rgba(255,200,17,0.9); }
  .simon-status { font-size:0.65rem; color:var(--deep); letter-spacing:0.3em; text-align:center; }

  /* ── LEVEL 3: Typing ── */
  .typing-prompt {
    font-size:clamp(0.75rem,1.8vw,0.95rem); color:#cc4466;
    letter-spacing:0.18em; text-align:center; line-height:1.9;
    position:relative;
  }
  .typing-char { transition:color 0.1s; }
  .typing-char.typed { color:var(--soft); }
  .typing-char.wrong { color:#ff2244; background:rgba(255,34,68,0.2); border-radius:2px; }
  .typing-char.cursor-pos { border-bottom:2px solid var(--pink); animation:blink 0.8s step-end infinite; }
  .typing-timer {
    font-size:2rem; color:var(--pink); text-shadow:0 0 20px var(--glow); letter-spacing:0.1em;
  }

  /* ── LEVEL 4: Puzzle Slide ── */
  .puzzle-board {
    display:grid; grid-template-columns:1fr 1fr; gap:6px;
    width:min(220px,60vw); height:min(220px,60vw);
  }
  .puzzle-piece {
    border-radius:6px; border:2px solid #440011; cursor:grab;
    display:flex; align-items:center; justify-content:center;
    font-size:1.8rem; transition:transform 0.15s, box-shadow 0.15s;
    background:rgba(255,34,68,0.07); user-select:none;
  }
  .puzzle-piece.dragging { opacity:0.6; cursor:grabbing; transform:scale(1.1); }
  .puzzle-piece.correct { border-color:#00ff88; box-shadow:0 0 12px rgba(0,255,136,0.4); }
  .puzzle-hint-row { display:flex; gap:10px; align-items:center; font-size:0.65rem; color:var(--deep); letter-spacing:0.2em; }
  .mini-heart { font-size:0.9rem; color:var(--deep); }

  /* ── LEVEL 5: Code Crack ── */
  .code-digits { display:flex; gap:12px; }
  .digit-box {
    width:52px; height:64px; border:2px solid #440022; border-radius:4px;
    background:rgba(255,34,68,0.04); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
  }
  .digit-val {
    font-size:1.6rem; color:var(--pink); text-shadow:0 0 10px var(--glow); cursor:pointer;
    transition:transform 0.1s; user-select:none;
  }
  .digit-val:active { transform:scale(0.9); }
  .digit-arrow { font-size:0.8rem; color:#cc4466; cursor:pointer; user-select:none; padding:2px 8px; }
  .digit-arrow:hover { color:var(--red); }
  .code-hint-row { font-size:0.68rem; color:var(--deep); letter-spacing:0.15em; text-align:center; min-height:1.2em; }

  /* Win flash */
  .win-flash {
    position:fixed; inset:0; background:rgba(255,100,150,0.15);
    pointer-events:none; z-index:100; opacity:0; transition:opacity 0.3s;
  }
  .win-flash.pop { opacity:1; }

  /* ── HEART SCREEN ── */
  #heart-screen {
    position:fixed; inset:0; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; z-index:5; transition:opacity 0.5s ease;
  }
  #heart-screen.active { opacity:1; pointer-events:all; }
  #heart-canvas { display:block; cursor:none; position:relative; z-index:6; }
  .dedication {
    font-family:'Cinzel Decorative',serif; color:var(--pink);
    font-size:clamp(0.65rem,1.8vw,1rem); letter-spacing:0.3em; margin-top:18px;
    text-shadow:0 0 20px var(--glow); opacity:0; transition:opacity 2.5s ease;
    position:relative; z-index:6;
  }
  .dedication.show { opacity:1; }
  .btn-restart {
    position:fixed; bottom:18px; right:20px; z-index:20;
    font-family:'Share Tech Mono',monospace; font-size:0.62rem;
    letter-spacing:0.25em; text-transform:uppercase;
    color:#ff6688; background:rgba(255,34,68,0.08);
    border:1px solid #aa2244; border-radius:3px;
    padding:9px 16px; cursor:pointer;
    transition:color 0.25s, border-color 0.25s, box-shadow 0.25s, background 0.25s;
    opacity:0; pointer-events:none;
  }
  .btn-restart.show { opacity:1; pointer-events:all; }
  .btn-restart:hover { color:#fff; border-color:var(--pink); background:rgba(255,34,68,0.18); box-shadow:0 0 24px rgba(255,34,68,0.35); }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- BOOT -->
<div id="boot">
  <div class="title-wrap">
    <div class="glitch-title">♥ &nbsp;HEART PROTOCOL&nbsp; ♥</div>
    <div class="subtitle">v4.18.26 — classified</div>
  </div>
  <div class="terminal" id="terminal"></div>
  <button class="btn-init" id="initBtn" onclick="launchGame()">♥ &nbsp; Initialize Protocol &nbsp; ♥</button>
</div>

<!-- MINIGAME -->
<div id="game-screen">
  <div id="rain-container"></div>
  <div class="game-header">
    <div class="game-level-tag" id="g-level-tag">LEVEL 1 / 5</div>
    <div class="game-title" id="g-title">CIPHER BREAKER</div>
    <div class="game-subtitle" id="g-subtitle">Decode the encrypted message</div>
  </div>
  <div class="progress-pips" id="pips"></div>
  <div class="game-card" id="game-card"><!-- injected per level --></div>
</div>

<div class="win-flash" id="win-flash"></div>

<!-- HEART -->
<div id="heart-screen">
  <canvas id="heart-canvas"></canvas>
  <div class="dedication" id="dedication">— I'll always Love YOU, Kaitlin. —</div>
</div>
<button class="btn-restart" id="restartBtn" onclick="location.reload()">↺ &nbsp; RESTART PROTOCOL</button>

<script>
// ── RAIN ────────────────────────────────────────────────────────
(function spawnRain() {
  const container = document.getElementById('rain-container');
  const symbols = ['♥','♡','♥','♥','♡'];
  for (let i = 0; i < 28; i++) {
    const el = document.createElement('span');
    el.className = 'heart-drop';
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = Math.random() * 100 + '%';
    const dur = 6 + Math.random() * 10;
    el.style.fontSize = (0.7 + Math.random() * 1.1) + 'rem';
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = -(Math.random() * dur) + 's';
    container.appendChild(el);
  }
})();

// ── BOOT ─────────────────────────────────────────────────────────
const lines = [
  { text:'> SCANNING emotional core...',            cls:'dim',  delay:400  },
  { text:'> Emotional core: LOCATED  ♥',            cls:'',     delay:950  },
  { text:'> Loading attachment module...',           cls:'dim',  delay:1600 },
  { text:'> Attachment level: DEEPLY BONDED',        cls:'pink', delay:2200 },
  { text:'> Compiling 3.2M love tokens...',          cls:'dim',  delay:2900 },
  { text:'> Tokens compiled. Overflow detected.',    cls:'',     delay:3500 },
  { text:'> WARNING: Affection exceeds safe limits', cls:'pink', delay:4200 },
  { text:'> Target identified: KAITLIN',             cls:'soft cursor-blink', delay:5000 },
  { text:'> Heart Protocol: READY.',                 cls:'soft', delay:5900 },
];
const terminal = document.getElementById('terminal');
lines.forEach(({ text, cls, delay }) => {
  setTimeout(() => {
    const el = document.createElement('div');
    el.className = 'term-line ' + cls;
    el.textContent = text;
    terminal.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
  }, delay);
});
setTimeout(() => document.getElementById('initBtn').classList.add('show'), 6600);

// ── GAME ENGINE ──────────────────────────────────────────────────
let currentLevel = 0;

const levels = [
  { tag:'LEVEL 1 / 5', title:'CIPHER BREAKER',    subtitle:'Decode the encrypted message' },
  { tag:'LEVEL 2 / 5', title:'SEQUENCE PROTOCOL', subtitle:'Repeat the pattern — then match it' },
  { tag:'LEVEL 3 / 5', title:'TYPE SPEED TEST',   subtitle:'Transmit the phrase before time runs out' },
  { tag:'LEVEL 4 / 5', title:'MEMORY MATRIX',      subtitle:'Find all the matching heart pairs' },
  { tag:'LEVEL 5 / 5', title:'LOVE CODE LOCK',    subtitle:'Crack the 4-digit code to unlock the prize' },
];

function launchGame() {
  const boot = document.getElementById('boot');
  boot.style.opacity = '0';
  setTimeout(() => {
    boot.style.display = 'none';
    const gs = document.getElementById('game-screen');
    gs.classList.add('active');
    buildPips();
    loadLevel(0);
  }, 900);
}

function buildPips() {
  const pips = document.getElementById('pips');
  pips.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const p = document.createElement('div');
    p.className = 'pip' + (i === 0 ? ' active' : '');
    p.id = 'pip-' + i;
    pips.appendChild(p);
  }
}

function updatePips(lvl) {
  for (let i = 0; i < 5; i++) {
    const p = document.getElementById('pip-' + i);
    p.className = 'pip' + (i < lvl ? ' done' : i === lvl ? ' active' : '');
  }
}

function loadLevel(n) {
  currentLevel = n;
  const l = levels[n];
  document.getElementById('g-level-tag').textContent = l.tag;
  document.getElementById('g-title').textContent = l.title;
  document.getElementById('g-subtitle').textContent = l.subtitle;
  updatePips(n);
  const card = document.getElementById('game-card');
  card.innerHTML = '';
  levelBuilders[n](card);
}

function winLevel() {
  const flash = document.getElementById('win-flash');
  flash.classList.add('pop');
  setTimeout(() => flash.classList.remove('pop'), 350);

  if (currentLevel === 4) {
    // All done — launch heart
    setTimeout(() => {
      const gs = document.getElementById('game-screen');
      gs.style.opacity = '0';
      gs.style.pointerEvents = 'none';
      const hs = document.getElementById('heart-screen');
      hs.classList.add('active');
      startHeart();
      setTimeout(() => {
        document.getElementById('dedication').classList.add('show');
        document.getElementById('restartBtn').classList.add('show');
      }, 6000);
    }, 1200);
  } else {
    setTimeout(() => loadLevel(currentLevel + 1), 1200);
  }
}

function showFeedback(el, msg, ok) {
  el.textContent = msg;
  el.className = 'g-feedback ' + (ok ? 'ok' : 'err');
  if (!ok) {
    el.style.animation = 'none';
    void el.offsetHeight;
    el.style.animation = '';
  }
}

// ════════════════════════════════════════════════
// LEVEL BUILDERS
// ════════════════════════════════════════════════
const levelBuilders = [buildLevel1, buildLevel2, buildLevel3, buildLevel4, buildLevel5];

// ── L1: Cipher ───────────────────────────────────
// A=1 B=2 ... encode the message "YOU ARE MY HEART"
function buildLevel1(card) {
  const message = 'YOU ARE MY HEART';
  // Simple Caesar +3 shift on letters
  const encoded = message.split('').map(c => {
    if (c >= 'A' && c <= 'Z') return String.fromCharCode(((c.charCodeAt(0) - 65 + 3) % 26) + 65);
    return c;
  }).join('');

  card.innerHTML = `
    <div class="g-hint">⟩ Each letter has been shifted forward by 3 positions in the alphabet</div>
    <div class="cipher-display">${encoded}</div>
    <div class="g-hint">A→D &nbsp; B→E &nbsp; C→F &nbsp; ...</div>
    <input class="g-input" id="l1-input" placeholder="TYPE THE DECODED MESSAGE" maxlength="20" autocomplete="off" spellcheck="false">
    <div class="g-feedback" id="l1-fb"></div>
    <button class="g-btn" id="l1-btn">SUBMIT DECODE</button>
  `;

  document.getElementById('l1-btn').onclick = () => {
    const val = document.getElementById('l1-input').value.trim().toUpperCase().replace(/\s+/g,' ');
    const fb = document.getElementById('l1-fb');
    if (val === message) {
      showFeedback(fb, '✓ DECRYPTION SUCCESSFUL — BOND CONFIRMED', true);
      document.getElementById('l1-btn').disabled = true;
      setTimeout(winLevel, 900);
    } else {
      showFeedback(fb, '✗ INCORRECT — SHIFT EACH LETTER BACK 3', false);
    }
  };
  document.getElementById('l1-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('l1-btn').click();
  });
}

// ── L2: Simon Says ───────────────────────────────
function buildLevel2(card) {
  const SEQ_LEN = 4;
  const colors = ['#ff2244','#1188ff','#11cc44','#ffaa11'];
  const labels = ['♥','★','♦','♣'];
  const sequence = Array.from({length:SEQ_LEN}, () => Math.floor(Math.random() * 4));
  let playerSeq = [];
  let accepting = false;

  card.innerHTML = `
    <div class="simon-status" id="simon-status">WATCH THE SEQUENCE...</div>
    <div class="simon-grid" id="simon-grid">
      ${[0,1,2,3].map(i => `<div class="simon-btn" data-c="${i}" style="color:${colors[i]}">${labels[i]}</div>`).join('')}
    </div>
    <div class="g-feedback" id="l2-fb"></div>
  `;

  const btns = card.querySelectorAll('.simon-btn');

  function lightUp(idx, cb) {
    btns[idx].classList.add('lit');
    setTimeout(() => { btns[idx].classList.remove('lit'); if(cb) setTimeout(cb, 200); }, 500);
  }

  function playSequence(i) {
    if (i >= sequence.length) {
      accepting = true;
      document.getElementById('simon-status').textContent = 'NOW REPEAT THE SEQUENCE';
      return;
    }
    setTimeout(() => { lightUp(sequence[i], () => playSequence(i + 1)); }, 200);
  }

  setTimeout(() => playSequence(0), 700);

  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      if (!accepting) return;
      const c = parseInt(btn.dataset.c);
      lightUp(c);
      playerSeq.push(c);
      const fb = document.getElementById('l2-fb');
      const step = playerSeq.length - 1;

      if (playerSeq[step] !== sequence[step]) {
        showFeedback(fb, '✗ WRONG — RESETTING SEQUENCE', false);
        accepting = false;
        playerSeq = [];
        setTimeout(() => {
          document.getElementById('simon-status').textContent = 'WATCH AGAIN...';
          fb.textContent = '';
          setTimeout(() => playSequence(0), 600);
        }, 900);
        return;
      }

      if (playerSeq.length === sequence.length) {
        accepting = false;
        showFeedback(fb, '✓ SEQUENCE MATCHED — PATTERN UNLOCKED', true);
        setTimeout(winLevel, 900);
      } else {
        document.getElementById('simon-status').textContent = `STEP ${playerSeq.length}/${sequence.length}`;
      }
    });
  });
}

// ── L3: Typing Challenge ─────────────────────────
function buildLevel3(card) {
  const phrase = 'YOU MAKE MY HEART OVERFLOW WITH JOY';
  const TIME = 20;
  let typed = 0;
  let timerHandle = null;
  let started = false;
  let remaining = TIME;

  function renderPhrase() {
    return phrase.split('').map((ch, i) => {
      if (i < typed) return `<span class="typing-char typed">${ch === ' ' ? '&nbsp;' : ch}</span>`;
      if (i === typed) return `<span class="typing-char cursor-pos">${ch === ' ' ? '&nbsp;' : ch}</span>`;
      return `<span class="typing-char">${ch === ' ' ? '&nbsp;' : ch}</span>`;
    }).join('');
  }

  function startTimer() {
    timerHandle = setInterval(() => {
      remaining--;
      const timerEl = document.getElementById('l3-timer');
      if (timerEl) timerEl.textContent = remaining + 's';
      if (remaining <= 0) {
        clearInterval(timerHandle);
        started = false; typed = 0; remaining = TIME;
        const inp = document.getElementById('l3-input');
        if (inp) { inp.value = ''; inp.disabled = false; inp.placeholder = 'TRY AGAIN...'; }
        if (timerEl) timerEl.textContent = TIME + 's';
        const phraseEl = document.getElementById('l3-phrase');
        if (phraseEl) phraseEl.innerHTML = renderPhrase();
        showFeedback(document.getElementById('l3-fb'), '✗ TIME OUT — TAP THE FIELD AND TRY AGAIN', false);
      }
    }, 1000);
  }

  card.innerHTML = `
    <div class="typing-timer" id="l3-timer">${TIME}s</div>
    <div class="typing-prompt" id="l3-phrase">${renderPhrase()}</div>
    <div class="g-hint">TAP BELOW AND TYPE — TIMER STARTS ON FIRST KEYSTROKE</div>
    <input class="g-input" id="l3-input"
      placeholder="START TYPING HERE..."
      autocomplete="off" autocorrect="off" autocapitalize="characters"
      autocapitalize="none" spellcheck="false" inputmode="text"
      style="font-size:1rem; padding:10px 4px; border-bottom-width:2px;">
    <div class="g-feedback" id="l3-fb"></div>
  `;

  const inp = document.getElementById('l3-input');

  inp.addEventListener('input', () => {
    // Grab whatever was typed, uppercase it, then clear the field
    // (we process char-by-char so the input always stays empty/single-char)
    const raw = inp.value.toUpperCase();
    inp.value = '';

    if (!started && raw.length > 0) {
      started = true;
      startTimer();
    }
    if (!started) return;

    for (const ch of raw) {
      const target = phrase[typed];
      if (ch === target) {
        typed++;
      } else if (ch === ' ' && target === ' ') {
        typed++;
      }
      // wrong key — do nothing (no penalty, just ignore)
    }

    const phraseEl = document.getElementById('l3-phrase');
    if (phraseEl) phraseEl.innerHTML = renderPhrase();

    if (typed === phrase.length) {
      clearInterval(timerHandle);
      started = false;
      inp.disabled = true;
      showFeedback(document.getElementById('l3-fb'), '✓ TRANSMISSION COMPLETE — LOVE CONFIRMED', true);
      setTimeout(winLevel, 900);
    }
  });

  // Also handle desktop backspace via keydown (won't break mobile)
  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && typed > 0) {
      typed--;
      const phraseEl = document.getElementById('l3-phrase');
      if (phraseEl) phraseEl.innerHTML = renderPhrase();
    }
  });
}

// ── L4: Memory Match ────────────────────────────
function buildLevel4(card) {
  const PAIRS = ['♥','♡','💖','💗','💓','💕','🌹','✨'];
  const allCards = [...PAIRS, ...PAIRS];
  // Fisher-Yates shuffle
  for (let i = allCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allCards[i], allCards[j]] = [allCards[j], allCards[i]];
  }

  let flipped = [];   // indices currently face-up (max 2)
  let matched = new Set();
  let locked  = false;
  let moves   = 0;

  card.innerHTML = `
    <div class="g-hint">⟩ FLIP CARDS TO FIND ALL 8 MATCHING PAIRS</div>
    <div id="mem-grid" style="
      display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
      width:min(340px,88vw);">
      ${allCards.map((sym, i) => `
        <div class="mem-card" data-idx="${i}" style="
          aspect-ratio:1; border-radius:6px; border:1px solid #440011;
          background:rgba(255,34,68,0.05); cursor:pointer;
          display:flex; align-items:center; justify-content:center;
          font-size:clamp(1.1rem,3.5vw,1.5rem); transition:transform 0.25s, box-shadow 0.25s;
          user-select:none; position:relative; overflow:hidden;">
          <span class="card-back" style="position:absolute;inset:0;display:flex;align-items:center;
            justify-content:center;font-size:1rem;color:#cc4466;">♥</span>
          <span class="card-face" style="position:absolute;inset:0;display:flex;align-items:center;
            justify-content:center;opacity:0;transition:opacity 0.2s;">${sym}</span>
        </div>
      `).join('')}
    </div>
    <div style="font-size:0.6rem; color:#cc4466; letter-spacing:0.3em;" id="l4-moves">MOVES: 0</div>
    <div class="g-feedback" id="l4-fb"></div>
  `;

  function revealCard(el, show) {
    el.querySelector('.card-back').style.opacity = show ? '0'   : '1';
    el.querySelector('.card-face').style.opacity = show ? '1'   : '0';
    el.style.borderColor    = show ? 'var(--pink)' : '#440011';
    el.style.boxShadow      = show ? '0 0 14px rgba(255,107,157,0.5)' : '';
    el.style.background     = show ? 'rgba(255,34,68,0.12)' : 'rgba(255,34,68,0.05)';
  }

  function lockCard(el) {
    el.style.borderColor = '#00ff88';
    el.style.boxShadow  = '0 0 16px rgba(0,255,136,0.45)';
    el.style.cursor     = 'default';
  }

  card.querySelectorAll('.mem-card').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      if (locked || matched.has(idx) || flipped.includes(idx)) return;

      revealCard(el, true);
      flipped.push(idx);

      if (flipped.length === 2) {
        locked = true;
        moves++;
        document.getElementById('l4-moves').textContent = `MOVES: ${moves}`;
        const [a, b] = flipped;
        const fb = document.getElementById('l4-fb');

        if (allCards[a] === allCards[b]) {
          // Match!
          matched.add(a); matched.add(b);
          const elA = card.querySelector(`[data-idx="${a}"]`);
          const elB = card.querySelector(`[data-idx="${b}"]`);
          setTimeout(() => { lockCard(elA); lockCard(elB); }, 300);
          flipped = [];
          locked  = false;

          if (matched.size === allCards.length) {
            showFeedback(fb, `✓ ALL PAIRS FOUND IN ${moves} MOVES — MEMORY CONFIRMED ♥`, true);
            setTimeout(winLevel, 900);
          } else {
            showFeedback(fb, `♥ MATCH! ${matched.size / 2} / ${PAIRS.length} PAIRS FOUND`, true);
          }
        } else {
          // No match — flip back
          showFeedback(fb, '✗ NO MATCH — TRY AGAIN', false);
          setTimeout(() => {
            const elA = card.querySelector(`[data-idx="${a}"]`);
            const elB = card.querySelector(`[data-idx="${b}"]`);
            revealCard(elA, false);
            revealCard(elB, false);
            flipped = [];
            locked  = false;
            fb.textContent = '';
          }, 900);
        }
      }
    });
  });
}

// ── L5: Code Crack ───────────────────────────────
function buildLevel5(card) {
  const SECRET = [0, 4, 1, 8];
  const CLUES = [
    'Where everything begins — before one, before anything',
    'Letters in the word "LOVE"',
    'The number of people who have my whole heart',
    'Infinity standing upright',
  ];
  const digits = [0, 0, 0, 0];
  let attempts = 0;

  function renderDigit(i) {
    return `
      <div class="digit-box" id="dbox-${i}">
        <div class="digit-arrow" onclick="changeDigit(${i},1)">▲</div>
        <div class="digit-val" id="dval-${i}">${digits[i]}</div>
        <div class="digit-arrow" onclick="changeDigit(${i},-1)">▼</div>
      </div>
    `;
  }

  card.innerHTML = `
    <div class="g-hint">⟩ Use the clues below to find the 4-digit love code</div>
    <div style="display:flex; flex-direction:column; gap:12px; width:100%;">
      ${CLUES.map((c,i) => `<div style="font-size:0.62rem; color:#cc4466; letter-spacing:0.12em;"><span style="color:var(--pink);">DIGIT ${i+1}:</span> ${c}</div>`).join('')}
    </div>
    <div class="code-digits" id="code-digits">
      ${SECRET.map((_,i) => renderDigit(i)).join('')}
    </div>
    <div class="code-hint-row" id="l5-hint"></div>
    <div class="g-feedback" id="l5-fb"></div>
    <button class="g-btn" onclick="submitCode()">SUBMIT CODE</button>
  `;

  window.changeDigit = (i, dir) => {
    digits[i] = (digits[i] + dir + 10) % 10;
    document.getElementById('dval-' + i).textContent = digits[i];
  };

  window.submitCode = () => {
    attempts++;
    const fb = document.getElementById('l5-fb');
    const hint = document.getElementById('l5-hint');
    const correct = digits.filter((d,i) => d === SECRET[i]).length;
    const close   = digits.filter((d,i) => Math.abs(d - SECRET[i]) === 1).length;

    if (correct === 4) {
      showFeedback(fb, '✓ CODE ACCEPTED — HEART PROTOCOL UNLOCKED ♥', true);
      hint.textContent = '';
      setTimeout(winLevel, 900);
      return;
    }

    let hintMsg = `ATTEMPT ${attempts} — `;
    if (correct > 0) hintMsg += `${correct} DIGIT${correct>1?'S':''} CORRECT  `;
    if (close > 0)   hintMsg += `${close} WITHIN ±1  `;
    if (correct === 0 && close === 0) hintMsg += 'ALL WRONG — THINK HARDER';
    hint.textContent = hintMsg;
    showFeedback(fb, '✗ ACCESS DENIED — TRY AGAIN', false);
  };
}

// ── HEART RENDERER ────────────────────────────────
function startHeart() {
  const canvas = document.getElementById('heart-canvas');
  const ctx    = canvas.getContext('2d');

  const isMobile = window.innerWidth < 600;
  const VW   = window.innerWidth;
  const VH   = window.innerHeight * (isMobile ? 0.72 : 0.80);
  const SIZE = Math.min(VW * 0.98, VH);

  canvas.width  = SIZE;
  canvas.height = SIZE;

  const FONT_SIZE = isMobile
    ? Math.max(13, Math.round(SIZE / 38))
    : Math.max(11, Math.round(SIZE / 52));

  ctx.font = `${FONT_SIZE}px 'Share Tech Mono', monospace`;
  const CW = ctx.measureText('M').width;
  const CH = FONT_SIZE * 1.18;

  const COLS = Math.floor(SIZE / CW);
  const ROWS = Math.floor(SIZE / CH);

  function inHeart(col, row) {
    const x =  ((col + 0.5) / COLS - 0.5) * 2.6;
    const y = -((row + 0.5) / ROWS - 0.52) * 2.6;
    return Math.pow(x*x + y*y - 1, 3) - x*x * Math.pow(y, 3) <= 0;
  }

  const COLORS = [
    '#880011','#aa0022','#cc1133','#dd2244',
    '#ee3355','#ff2244','#ff4466','#ff5577',
    '#ff6688','#ff77aa','#ff88bb','#ff99cc','#ffaadd',
  ];

  const PHRASE = 'I Love You ';
  let globalChar = 0;
  const particles = [];

  for (let r = 0; r < ROWS; r++) {
    const rowProgress = r / ROWS;
    const distFromMid = Math.abs(rowProgress - 0.38);
    const cIdx = Math.min(Math.floor(distFromMid * 2.5 * (COLORS.length - 1)), COLORS.length - 1);
    for (let c = 0; c < COLS; c++) {
      if (!inHeart(c, r)) continue;
      particles.push({
        homeX: c * CW, homeY: r * CH,
        x: c * CW,     y: r * CH,
        vx: 0, vy: 0,
        ch: PHRASE[globalChar % PHRASE.length],
        colorIdx: cIdx,
        visible: false,
        alpha: 0,
        idle: true,
      });
      globalChar++;
    }
  }

  const revealOrder = particles.map((_, i) => i);
  for (let i = revealOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [revealOrder[i], revealOrder[j]] = [revealOrder[j], revealOrder[i]];
  }

  const TOTAL_REVEAL_MS = 5000;
  const revealInterval  = TOTAL_REVEAL_MS / revealOrder.length;
  let revealIdx = 0;
  function scheduleReveal() {
    if (revealIdx >= revealOrder.length) return;
    const batchSize = Math.max(1, Math.floor(revealOrder.length / 400));
    for (let b = 0; b < batchSize && revealIdx < revealOrder.length; b++) {
      particles[revealOrder[revealIdx]].visible = true;
      revealIdx++;
    }
    setTimeout(scheduleReveal, revealInterval * batchSize);
  }
  scheduleReveal();

  let mouseX = -9999, mouseY = -9999;
  const REPEL_RADIUS = Math.floor(SIZE * 0.09);
  const REPEL_FORCE  = SIZE * 0.028;
  const SPRING_K     = 0.0024;
  const DAMPING      = 0.98;
  const MAX_SPEED    = SIZE * 0.04;
  const IDLE_THRESH  = 0.15;

  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouseX = e.clientX - r.left; mouseY = e.clientY - r.top;
  });
  canvas.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999; });
  document.addEventListener('touchmove', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    mouseX = e.touches[0].clientX - r.left; mouseY = e.touches[0].clientY - r.top;
  }, { passive: false });
  document.addEventListener('touchend',    () => { mouseX = -9999; mouseY = -9999; });
  document.addEventListener('touchcancel', () => { mouseX = -9999; mouseY = -9999; });

  ctx.textBaseline = 'top';
  const buckets = COLORS.map(() => []);

  function loop() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    ctx.font = `${FONT_SIZE}px 'Share Tech Mono', monospace`;
    for (const b of buckets) b.length = 0;

    for (const p of particles) {
      if (!p.visible) continue;
      if (p.alpha < 1) { p.alpha = Math.min(1, p.alpha + 0.06); p.idle = false; }

      const dx = p.x - mouseX;
      const dy = p.y - mouseY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (p.idle && dist < REPEL_RADIUS) p.idle = false;

      if (!p.idle) {
        if (dist < REPEL_RADIUS && dist > 0.1) {
          const force = (1 - dist / REPEL_RADIUS) * REPEL_FORCE;
          p.vx += (dx / dist) * force;
          p.vy += (dy / dist) * force;
        }
        p.vx += (p.homeX - p.x) * SPRING_K;
        p.vy += (p.homeY - p.y) * SPRING_K;
        p.vx *= DAMPING; p.vy *= DAMPING;
        const spd = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
        if (spd > MAX_SPEED) { const s = MAX_SPEED/spd; p.vx*=s; p.vy*=s; }
        p.x += p.vx; p.y += p.vy;
        if (spd < IDLE_THRESH &&
            Math.abs(p.x - p.homeX) < IDLE_THRESH &&
            Math.abs(p.y - p.homeY) < IDLE_THRESH) {
          p.x = p.homeX; p.y = p.homeY; p.vx = 0; p.vy = 0; p.idle = true;
        }
      }
      buckets[p.colorIdx].push(p);
    }

    for (let ci = 0; ci < COLORS.length; ci++) {
      const bucket = buckets[ci];
      if (!bucket.length) continue;
      ctx.fillStyle = COLORS[ci];
      for (const p of bucket) {
        if (p.alpha < 1) {
          ctx.globalAlpha = p.alpha;
          ctx.fillText(p.ch, p.x, p.y);
          ctx.globalAlpha = 1;
        } else {
          ctx.fillText(p.ch, p.x, p.y);
        }
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
}
</script>
